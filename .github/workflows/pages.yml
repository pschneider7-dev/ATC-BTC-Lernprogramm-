# Veröffentlicht die App auf GitHub Pages: https://pschneider7-dev.github.io/ATC-BTC-Lernprogramm-/
# Einmalig nötig: Settings → Pages → Build and deployment → Source: „GitHub Actions“.
name: App veröffentlichen

on:
  push:
    branches: [claude/jtac-vorschriften-dokumente-wn65ow, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # private Repositories haben im kostenlosen Konto kein Pages
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Offline-Speicher (sw.js) für genau diesen Stand erzeugen
        run: python3 tools/pwa.py

      - name: Nur die App-Dateien zusammenstellen
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js assets data _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
